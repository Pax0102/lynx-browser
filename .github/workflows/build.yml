name: Build Lynx Browser

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libgtk-3-dev libdbus-glib-1-dev \
            libxt-dev libx11-xcb-dev libxcb-shm0-dev \
            curl python3 python3-pip nasm yasm \
            libpulse-dev libasound2-dev \
            zip unzip git mercurial imagemagick

      - name: Instalar Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain 1.76.0
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Baixar código fonte do Firefox
        run: |
          curl -L "https://archive.mozilla.org/pub/firefox/releases/128.0/source/firefox-128.0.source.tar.xz" \
            -o firefox-source.tar.xz
          tar -xJf firefox-source.tar.xz
          mv firefox-128.0 firefox-src
          rm firefox-source.tar.xz

      - name: Corrigir bug do cbindgen.toml do Firefox 128
        run: |
          cd firefox-src
          cat > /tmp/fix_toml.py << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path, 'r') as f:
              lines = f.readlines()
          seen = set()
          result = []
          for line in lines:
              stripped = line.strip()
              if '=' in stripped and stripped.startswith('"'):
                  key = stripped.split('=')[0].strip()
                  if key in seen:
                      print(f'Removendo duplicata: {stripped}')
                      continue
                  seen.add(key)
              result.append(line)
          with open(path, 'w') as f:
              f.writelines(result)
          print(f'Corrigido: {path}')
          PYEOF
          find . -name "cbindgen.toml" | while read toml; do
            echo "Verificando: $toml"
            python3 /tmp/fix_toml.py "$toml"
          done

      - name: Corrigir branding - Nightly para Lynx
        run: |
          cd firefox-src

          # Troca Nightly → Lynx Browser APENAS nos arquivos de branding específicos
          sed -i 's/Nightly/Lynx Browser/g' browser/branding/unofficial/locales/en-US/brand.ftl 2>/dev/null || true
          sed -i 's/Nightly/Lynx Browser/g' browser/branding/unofficial/locales/en-US/brand.properties 2>/dev/null || true

          # Troca Mozilla Firefox → Lynx Browser APENAS em .properties e .ftl de localização
          # Exclui explicitamente qualquer arquivo .toml, .rs, .py, .cpp, .h, .js
          find browser/locales browser/branding -type f \( -name "*.properties" -o -name "*.ftl" \) | \
            xargs sed -i \
              's/Mozilla Firefox Nightly/Lynx Browser/g;
               s/Firefox Nightly/Lynx Browser/g;
               s/Mozilla Firefox/Lynx Browser/g;
               s/Firefox/Lynx Browser/g;
               s/Nightly/Lynx Browser/g' 2>/dev/null || true

          # Remove Pocket
          sed -i 's/pocket//' browser/components/BrowserComponents.manifest || true
          find . -path "*/pocket*" -name "*.ftl" -exec sed -i 's/pocket//' {} \; || true

          # Corrige user agent para não ser bloqueado pelo Google
          find . -type f -name "*.js" | xargs grep -l "firefox-b-d\|Firefox/128" 2>/dev/null | head -5 | \
            xargs sed -i 's/firefox-b-d/lynx-b-d/g' 2>/dev/null || true

      - name: Copiar branding customizado
        run: |
          cd firefox-src

          # Converte logo para múltiplos tamanhos necessários
          convert ../branding/lynx-logo.png -resize 256x256 browser/branding/unofficial/default256.png || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/default256.png
          convert ../branding/lynx-logo.png -resize 128x128 browser/branding/unofficial/default128.png || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/default128.png
          convert ../branding/lynx-logo.png -resize 64x64  browser/branding/unofficial/default64.png  || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/default64.png
          convert ../branding/lynx-logo.png -resize 48x48  browser/branding/unofficial/default48.png  || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/default48.png
          convert ../branding/lynx-logo.png -resize 32x32  browser/branding/unofficial/default32.png  || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/default32.png
          convert ../branding/lynx-logo.png -resize 16x16  browser/branding/unofficial/default16.png  || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/default16.png

          # Logo dentro do navegador (about:, menus)
          convert ../branding/lynx-logo.png -resize 192x192 browser/branding/unofficial/content/about-logo.png || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/content/about-logo.png
          convert ../branding/lynx-logo.png -resize 384x384 browser/branding/unofficial/content/about-logo@2x.png || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/content/about-logo@2x.png

      - name: Copiar mozconfig
        run: cp config/mozconfig firefox-src/.mozconfig

      - name: Compilar
        run: |
          cd firefox-src
          export MOZBUILD_STATE_PATH=$HOME/.mozbuild
          python3 ./mach bootstrap --application-choice=browser --no-interactive || true
          python3 ./mach build

      - name: Empacotar e configurar
        run: |
          cd firefox-src
          python3 ./mach package

          # Extrai o pacote gerado
          PKG=$(find obj-* -name "*.tar.bz2" | head -1)
          tar -xjf "$PKG"

          # Cola o home.html dentro da pasta do navegador
          mkdir -p lynx/lynx-home
          cp ../config/home.html lynx/lynx-home/home.html

          # Cria userChrome.css para remover logo Firefox da interface
          mkdir -p lynx/defaults/profile/chrome
          cat > lynx/defaults/profile/chrome/userChrome.css << 'CSS_EOF'
          /* Remove logo e referências ao Firefox na interface */
          #PanelUI-menu-button .toolbarbutton-icon {
              list-style-image: none !important;
          }
          #appMenu-protonMainView .panel-header h1,
          #appMenu-protonMainView .panel-header description {
              visibility: collapse !important;
          }
          /* Remove barra de bookmarks */
          #PersonalToolbar {
              display: none !important;
          }
          /* Remove botão do Pocket */
          #save-to-pocket-button {
              display: none !important;
          }
          CSS_EOF

          # Cria userContent.css para dark mode nas páginas internas
          cat > lynx/defaults/profile/chrome/userContent.css << 'CONTENT_EOF'
          @-moz-document url-prefix("about:") {
              :root {
                  color-scheme: dark !important;
                  background: #050506 !important;
                  color: #eef1f8 !important;
              }
          }
          CONTENT_EOF

          # Cria script de setup que configura policies.json com caminho correto
          cat > lynx/setup.sh << 'SETUP_EOF'
          #!/usr/bin/env bash
          BASE="$(cd "$(dirname "$0")" && pwd)"
          DIST="$BASE/distribution"
          HOME_URL="file://$BASE/lynx-home/home.html"
          mkdir -p "$DIST"
          cat > "$DIST/policies.json" << POLICIES_EOF
          {
            "policies": {
              "Homepage": {
                "URL": "$HOME_URL",
                "Locked": true,
                "StartPage": "homepage"
              },
              "NewTabPage": "$HOME_URL",
              "OverrideFirstRunPage": "",
              "OverridePostUpdatePage": "",
              "DisableFirefoxStudies": true,
              "DisableTelemetry": true,
              "DisablePocket": true,
              "DisplayBookmarksToolbar": "never",
              "DisplayMenuBar": "default-off"
            }
          }
          POLICIES_EOF
          echo "Lynx Browser configurado!"
          SETUP_EOF
          chmod +x lynx/setup.sh

          # Cria launcher principal
          cat > lynx/start.sh << 'START_EOF'
          #!/usr/bin/env bash
          BASE="$(cd "$(dirname "$0")" && pwd)"
          bash "$BASE/setup.sh"

          PROFILE="$BASE/profile"
          mkdir -p "$PROFILE/chrome"

          # Copia userChrome e userContent
          cp "$BASE/defaults/profile/chrome/userChrome.css" "$PROFILE/chrome/" 2>/dev/null || true
          cp "$BASE/defaults/profile/chrome/userContent.css" "$PROFILE/chrome/" 2>/dev/null || true

          cat > "$PROFILE/user.js" << USERJS_EOF
          /* Lynx Browser */
          user_pref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
          user_pref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");
          user_pref("browser.shell.checkDefaultBrowser", false);
          user_pref("browser.warnOnQuit", false);
          user_pref("browser.sessionstore.resume_from_crash", false);
          user_pref("startup.homepage_welcome_url", "");
          user_pref("startup.homepage_welcome_url.additional", "");
          user_pref("startup.homepage_override_url", "");
          user_pref("browser.startup.upgradeDialog.enabled", false);
          user_pref("datareporting.policy.dataSubmissionPolicyBypassNotification", true);
          user_pref("network.trr.mode", 2);
          user_pref("network.trr.uri", "https://cloudflare-dns.com/dns-query");
          user_pref("privacy.trackingprotection.enabled", true);
          user_pref("media.peerconnection.enabled", false);
          user_pref("extensions.pocket.enabled", false);
          user_pref("browser.toolbars.bookmarks.visibility", "never");
          user_pref("intl.locale.requested", "pt-BR");
          user_pref("general.useragent.override", "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Lynx/128.0");
          USERJS_EOF

          exec "$BASE/lynx" \
            --no-remote \
            --profile "$PROFILE" \
            "file://$BASE/lynx-home/home.html" \
            "$@"
          START_EOF
          chmod +x lynx/start.sh

          # Reempacota tudo
          tar -cjf ../lynx-browser-linux-x64.tar.bz2 lynx/

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: lynx-browser-linux-x64
          path: lynx-browser-linux-x64.tar.bz2
          retention-days: 30

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lynx Browser v1.0.${{ github.run_number }}
          files: lynx-browser-linux-x64.tar.bz2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
