name: Build Lynx Browser

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repositório do Lynx
        uses: actions/checkout@v4

      - name: Instalar dependências básicas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git mercurial python3 python3-pip \
            imagemagick zip unzip yasm nasm

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Usa um checkout Git real do Firefox 128 em vez de um source tarball
      # com um .git artificial. Isso permite ao mozversioncontrol/toolchain
      # do Firefox identificar corretamente o changeset da árvore.
      - name: Baixar Firefox 128
        uses: actions/checkout@v4
        with:
          repository: mozilla-firefox/firefox
          ref: FIREFOX_128_0_RELEASE
          path: firefox-src
          fetch-depth: 1

      - name: Bootstrap do ambiente Firefox
        working-directory: firefox-src
        env:
          MOZBUILD_STATE_PATH: ${{ runner.temp }}/mozbuild
        run: |
          python3 ./mach --no-interactive bootstrap --application-choice=browser

      - name: Copiar mozconfig do Lynx
        run: |
          test -f config/mozconfig
          cp config/mozconfig firefox-src/.mozconfig
          cat firefox-src/.mozconfig

      - name: Corrigir branding para Lynx
        working-directory: firefox-src
        run: |
          # Mantém a infraestrutura "unofficial" do Firefox para a build
          # customizada, mas troca os nomes visíveis para Lynx Browser.
          sed -i 's/Nightly/Lynx Browser/g' \
            browser/branding/unofficial/locales/en-US/brand.ftl 2>/dev/null || true

          sed -i 's/Nightly/Lynx Browser/g' \
            browser/branding/unofficial/locales/en-US/brand.properties 2>/dev/null || true

          find browser/locales browser/branding -type f \
            \( -name "*.properties" -o -name "*.ftl" \) -print0 |
            xargs -0 -r sed -i \
              -e 's/Mozilla Firefox Nightly/Lynx Browser/g' \
              -e 's/Firefox Nightly/Lynx Browser/g' \
              -e 's/Mozilla Firefox/Lynx Browser/g' \
              -e 's/Firefox/Lynx Browser/g' \
              -e 's/Nightly/Lynx Browser/g'

          # Mantém a função existente de remover Pocket.
          sed -i 's/pocket//' \
            browser/components/BrowserComponents.manifest 2>/dev/null || true

          find . -path "./third_party" -prune -o \
            -path "*/pocket*" -name "*.ftl" -print0 |
            xargs -0 -r sed -i 's/pocket//'

          # Mantém a função existente de usar o UA customizado do Lynx.
          grep -rlZ -E 'firefox-b-d|Firefox/128' browser 2>/dev/null |
            xargs -0 -r sed -i \
              -e 's/firefox-b-d/lynx-b-d/g' \
              -e 's/Firefox\/128/Lynx\/128/g'

      - name: Copiar branding customizado
        working-directory: firefox-src
        run: |
          mkdir -p browser/branding/unofficial/content

          convert ../branding/lynx-logo.png -resize 256x256 \
            browser/branding/unofficial/default256.png || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/default256.png

          convert ../branding/lynx-logo.png -resize 128x128 \
            browser/branding/unofficial/default128.png || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/default128.png

          convert ../branding/lynx-logo.png -resize 64x64 \
            browser/branding/unofficial/default64.png || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/default64.png

          convert ../branding/lynx-logo.png -resize 48x48 \
            browser/branding/unofficial/default48.png || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/default48.png

          convert ../branding/lynx-logo.png -resize 32x32 \
            browser/branding/unofficial/default32.png || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/default32.png

          convert ../branding/lynx-logo.png -resize 16x16 \
            browser/branding/unofficial/default16.png || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/default16.png

          convert ../branding/lynx-logo.png -resize 192x192 \
            browser/branding/unofficial/content/about-logo.png || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/content/about-logo.png

          convert ../branding/lynx-logo.png -resize 384x384 \
            browser/branding/unofficial/content/about-logo@2x.png || \
            cp ../branding/lynx-logo.png browser/branding/unofficial/content/about-logo@2x.png

      - name: Compilar Lynx
        working-directory: firefox-src
        env:
          MOZBUILD_STATE_PATH: ${{ runner.temp }}/mozbuild
        run: |
          python3 ./mach build

      - name: Empacotar e configurar
        env:
          WORK: ${{ github.workspace }}/lynx-build
        run: |
          set -euo pipefail

          rm -rf "$WORK"
          mkdir -p "$WORK"

          cd firefox-src
          python3 ./mach package

          PKG=$(find obj-* -type f \
            \( -name "*.tar.bz2" -o -name "*.tar.xz" \) | head -1)

          if [ -z "$PKG" ]; then
            echo "ERRO: nenhum pacote .tar.bz2/.tar.xz encontrado."
            exit 1
          fi

          echo "Pacote encontrado: $PKG"

          case "$PKG" in
            *.tar.xz)
              tar -xJf "$PKG" -C "$WORK"
              ;;
            *.tar.bz2)
              tar -xjf "$PKG" -C "$WORK"
              ;;
            *)
              echo "ERRO: formato desconhecido: $PKG"
              exit 1
              ;;
          esac

          APP_DIR=$(find "$WORK" -mindepth 1 -maxdepth 1 -type d | head -1)

          if [ -z "$APP_DIR" ]; then
            echo "ERRO: não encontrei a pasta do aplicativo."
            exit 1
          fi

          mv "$APP_DIR" "$WORK/LynxBrowser"

          cd "$WORK/LynxBrowser"

          # Compatibilidade: se o build gerar "firefox" como binário,
          # o Lynx usa um link "lynx" sem alterar o binário real.
          if [ ! -x "./lynx" ] && [ -x "./firefox" ]; then
            ln -sf firefox lynx
          fi

          if [ ! -x "./lynx" ]; then
            echo "ERRO: binário principal do Lynx não encontrado."
            ls -la
            exit 1
          fi

          # Mantém a home atual do projeto.
          rm -rf lynx-home
          mkdir -p lynx-home
          cp "$GITHUB_WORKSPACE/config/home.html" lynx-home/home.html

          # Mantém a logo do projeto no pacote.
          cp "$GITHUB_WORKSPACE/branding/lynx-logo.png" lynx-logo.png

          # Cria New Tab do Lynx. A build é unbranded/unsigned-capable,
          # então o XPI pode ser instalado por ExtensionSettings.
          NEWTAB_TMP="$WORK/lynx-newtab"
          XPI="$WORK/LynxBrowser/lynx-newtab.xpi"

          rm -rf "$NEWTAB_TMP"
          mkdir -p "$NEWTAB_TMP"

          cat > "$NEWTAB_TMP/manifest.json" <<'MANIFEST_EOF'
          {
            "manifest_version": 3,
            "name": "Lynx New Tab",
            "version": "1.0.0",
            "description": "New Tab oficial do Lynx Browser.",
            "browser_specific_settings": {
              "gecko": {
                "id": "lynx-newtab@lynxbrowser.local"
              }
            },
            "chrome_url_overrides": {
              "newtab": "home.html"
            }
          }
          MANIFEST_EOF

          cp "$WORK/LynxBrowser/lynx-home/home.html" "$NEWTAB_TMP/home.html"

          (
            cd "$NEWTAB_TMP"
            zip -qr "$XPI" .
          )

          rm -rf "$NEWTAB_TMP"

          # CSS da interface do Lynx.
          mkdir -p defaults/profile/chrome

          cat > defaults/profile/chrome/userChrome.css <<'CSS_EOF'
          /* Lynx Browser */
          #appMenu-protonMainView .panel-header h1,
          #appMenu-protonMainView .panel-header description {
              visibility: collapse !important;
          }

          #titlebar {
              -moz-appearance: none !important;
          }

          #PersonalToolbar {
              display: none !important;
          }

          #save-to-pocket-button {
              display: none !important;
          }
          CSS_EOF

          # Dark mode para páginas internas.
          cat > defaults/profile/chrome/userContent.css <<'CONTENT_EOF'
          @-moz-document url-prefix("about:") {
              :root {
                  color-scheme: dark !important;
                  background: #050506 !important;
                  color: #eef1f8 !important;
              }
          }
          CONTENT_EOF

          # Setup: cria a policy depois que o pacote for extraído,
          # pois o caminho absoluto varia conforme o PC do usuário.
          cat > setup.sh <<'SETUP_EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          BASE="$(cd "$(dirname "$0")" && pwd)"
          DIST="$BASE/distribution"

          mkdir -p "$DIST"

          HOME_URL="$(python3 - "$BASE/lynx-home/home.html" <<'PY'
          import sys
          from pathlib import Path
          from urllib.parse import quote

          print("file://" + quote(str(Path(sys.argv[1]).resolve())))
          PY
          )"

          XPI_URL="$(python3 - "$BASE/lynx-newtab.xpi" <<'PY'
          import sys
          from pathlib import Path
          from urllib.parse import quote

          print("file://" + quote(str(Path(sys.argv[1]).resolve())))
          PY
          )"

          cat > "$DIST/policies.json" <<POLICIES_EOF
          {
            "policies": {
              "ExtensionSettings": {
                "lynx-newtab@lynxbrowser.local": {
                  "installation_mode": "force_installed",
                  "install_url": "$XPI_URL",
                  "updates_disabled": true
                }
              },
              "Homepage": {
                "URL": "$HOME_URL",
                "Locked": true,
                "StartPage": "homepage"
              },
              "OverrideFirstRunPage": "",
              "OverridePostUpdatePage": "",
              "DisableFirefoxStudies": true,
              "DisableTelemetry": true,
              "DisablePocket": true,
              "DisplayBookmarksToolbar": "never",
              "DisplayMenuBar": "default-off"
            }
          }
          POLICIES_EOF
          SETUP_EOF

          chmod +x setup.sh

          # Launcher principal.
          cat > start.sh <<'START_EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          BASE="$(cd "$(dirname "$0")" && pwd)"

          bash "$BASE/setup.sh"

          PROFILE="$BASE/profile"
          mkdir -p "$PROFILE/chrome"

          cp "$BASE/defaults/profile/chrome/userChrome.css" \
             "$PROFILE/chrome/userChrome.css"

          cp "$BASE/defaults/profile/chrome/userContent.css" \
             "$PROFILE/chrome/userContent.css"

          cat > "$PROFILE/user.js" <<'USERJS_EOF'
          /* Lynx Browser */

          user_pref("xpinstall.signatures.required", false);

          user_pref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
          user_pref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");

          user_pref("browser.shell.checkDefaultBrowser", false);
          user_pref("browser.warnOnQuit", false);
          user_pref("browser.sessionstore.resume_from_crash", false);

          user_pref("startup.homepage_welcome_url", "");
          user_pref("startup.homepage_welcome_url.additional", "");
          user_pref("startup.homepage_override_url", "");
          user_pref("browser.startup.upgradeDialog.enabled", false);
          user_pref("datareporting.policy.dataSubmissionPolicyBypassNotification", true);

          user_pref("network.trr.mode", 2);
          user_pref("network.trr.uri", "https://cloudflare-dns.com/dns-query");
          user_pref("network.trr.bootstrapAddress", "1.1.1.1");

          user_pref("privacy.trackingprotection.enabled", true);
          user_pref("privacy.trackingprotection.pbmode.enabled", true);
          user_pref("privacy.trackingprotection.socialtracking.enabled", true);
          user_pref("privacy.partition.network_state", true);
          user_pref("privacy.partition.network_state.ocsp_cache", true);

          user_pref("media.peerconnection.enabled", false);
          user_pref("dom.battery.enabled", false);
          user_pref("browser.send_pings", false);

          user_pref("extensions.pocket.enabled", false);
          user_pref("browser.toolbars.bookmarks.visibility", "never");
          user_pref("intl.locale.requested", "pt-BR");
          user_pref("general.useragent.override", "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Lynx/128.0");
          USERJS_EOF

          HOME_URL="$(python3 - "$BASE/lynx-home/home.html" <<'PY'
          import sys
          from pathlib import Path
          from urllib.parse import quote

          print("file://" + quote(str(Path(sys.argv[1]).resolve())))
          PY
          )"

          exec "$BASE/lynx" \
            --no-remote \
            --profile "$PROFILE" \
            "$HOME_URL" \
            "$@"
          START_EOF

          chmod +x start.sh

          cat > "Lynx Browser.desktop" <<'DESKTOP_EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Lynx Browser
          GenericName=Web Browser
          Comment=Lynx Browser
          Exec=./start.sh
          Icon=./lynx-logo.png
          Terminal=false
          StartupNotify=true
          StartupWMClass=Lynx
          Categories=Network;WebBrowser;
          Keywords=Internet;Browser;Lynx;
          DESKTOP_EOF

          # Garante que o release final tenha a estrutura desejada.
          find . -maxdepth 1 -type f -printf '%f\n' | sort

          tar -cjf "$GITHUB_WORKSPACE/lynx-browser-linux-x64.tar.bz2" LynxBrowser

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: lynx-browser-linux-x64
          path: lynx-browser-linux-x64.tar.bz2
          retention-days: 30

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lynx Browser v1.0.${{ github.run_number }}
          files: lynx-browser-linux-x64.tar.bz2
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
